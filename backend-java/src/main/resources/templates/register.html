<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Deepfake Defense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="mb-3">Register</h3>
          <input id="email" class="form-control mb-2" placeholder="Email" />
          <input id="password" type="password" class="form-control mb-3" placeholder="Password" />
          <button class="btn btn-success w-100" onclick="register()">Create account</button>
          <a href="/login" class="btn btn-link w-100 mt-2">Back to login</a>
          <div id="msg" class="mt-3 text-danger small"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>

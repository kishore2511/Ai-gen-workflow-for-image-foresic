<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload - Deepfake Defense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Deepfake Image Analyzer</h3>
    <button class="btn btn-outline-secondary" onclick="logout()">Logout</button>
  </div>
  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <input id="imageFile" type="file" accept="image/*" class="form-control mb-3">
      <button class="btn btn-primary" onclick="uploadImage()">Analyze image</button>
      <pre id="result" class="bg-dark text-white p-3 mt-3 rounded"></pre>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <h5>My upload history</h5>
      <button class="btn btn-sm btn-outline-primary mb-2" onclick="loadHistory()">Refresh history</button>
      <div id="history"></div>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>loadHistory()</script>
</body>
</html>
